name: 🐛 Bug report
description: Something in FetchXML Studio isn't working as expected.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please provide enough detail so we can reproduce the issue.
        **Do not include secrets** (tokens, client secrets, Authorization headers) or customer data.

  - type: checkboxes
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and discussions and didn't find a duplicate.
          required: true
        - label: I'm using the latest released version (or I've confirmed the issue exists on main).
          required: true
        - label: I can reproduce this consistently.
          required: false

  - type: input
    attributes:
      label: FetchXML Studio version
      description: Version number or commit SHA.
      placeholder: "e.g., 1.4.1 or 1a2b3c4"
    validations:
      required: true

  - type: input
    attributes:
      label: PPTB version
      placeholder: "e.g., 1.2.7"
    validations:
      required: false

  - type: input
    attributes:
      label: OS
      placeholder: "e.g., Windows 11 / macOS 14"
    validations:
      required: false

  - type: dropdown
    attributes:
      label: Area
      options:
        - Query builder (tree / properties panel)
        - FetchXML editor / Parse to Tree
        - Validation
        - Query execution / paging
        - Results grid
        - Export (Excel / CSV / clipboard)
        - Views (load / save)
        - Metadata loading (tables / columns / relationships)
        - Performance
        - Other (please specify below)
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: "Describe what you observed..."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps to reproduce the issue.
      placeholder: |
        1. Open FetchXML Studio in PPTB
        2. Select table / paste FetchXML...
        3. Execute...
        4. Observe...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      placeholder: "What should have happened?"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behavior
      placeholder: "What actually happened?"
    validations:
      required: true

  - type: textarea
    attributes:
      label: FetchXML (optional)
      description: The smallest query that reproduces the issue (redact names if needed).
      render: xml
    validations:
      required: false

  - type: textarea
    attributes:
      label: Dataverse error / paging details (optional)
      description: HTTP status, error code and message shown in the UI, request/correlation ID, and whether you hit row limits or paging (sanitize).
      placeholder: |
        Status: 400
        Error code: 0x...
        Message: ...
        Returns exactly 5000 rows / more records link present
      render: shell
    validations:
      required: false

  - type: textarea
    attributes:
      label: Screenshots or recordings (optional)
      description: Drag and drop images/video here.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Console logs (optional)
      description: Paste relevant devtools logs (sanitize sensitive info).
      render: shell
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context
      description: Anything else that might help.
    validations:
      required: false
