name: CI

on:
  pull_request:
  push:
    branches: [dev, main, "release/**", "support/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Like the release build (#188): only esbuild and fsevents have install scripts, and neither needs them
      - run: npm ci --ignore-scripts
      - name: Audit runtime dependencies (no high or critical findings)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - name: Check the bundled DOMPurify (Monaco ships its own; vite.config.ts replaces it)
        run: node .github/scripts/check-dompurify.mjs
      - name: Check package contents
        run: |
          npm pack --dry-run --json --silent > "$RUNNER_TEMP/pack.json"
          node .github/scripts/check-pack.mjs "$RUNNER_TEMP/pack.json"
