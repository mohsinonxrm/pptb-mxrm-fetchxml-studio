name: Release

# Pushing a vX.Y.Z (or vX.Y.Z-beta.N / -rc.N) tag publishes the package to npm through
# trusted publishing (no npm token) and creates the GitHub Release. See RELEASING.md.
# Running it by hand (Actions → Release → Run workflow, or `gh workflow run release.yml --ref
# <branch>`) rehearses a release: every check and `npm publish --dry-run`, with no npm token
# and no GitHub Release. Only a tag push publishes.
#
# Supply chain (#188):
# - build: installs and runs the dependencies with read-only permissions, no install scripts
#   and no cache, and packs the tarball.
# - publish: the only job that can get the npm OIDC token, and only for a tag push. It installs
#   no project dependencies and publishes the tarball build packed.
# - github-release: the only job that can write to the repository.
# - Node, npm and the actions are pinned to versions at least 14 days old (the project's
#   dependency rule). Dependabot proposes newer actions on dev; other branches get them through
#   merges.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# One release run per ref at a time; a running publish is never cancelled
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.channel.outputs.name }}
      version: ${{ steps.channel.outputs.version }}
      dist_tag: ${{ steps.channel.outputs.dist_tag }}
      latest: ${{ steps.channel.outputs.latest }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # choosing the channel needs main's and support/*'s history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Choose the release channel
        id: channel
        run: |
          # RELEASING.md: -beta.N / -rc.N -> npm "beta" (GitHub pre-release). A stable tag on
          # support/X.Y -> "support-X.Y", never "latest". A stable tag on main -> "latest", but
          # only for main's own release line: support branches merge forward into main, so an
          # older line's commit can be on main too and mustn't move "latest" back.
          # Anything else fails here, so a stray tag can't replace "latest".
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-beta.*|*-rc.*)
              dist_tag=beta; latest=false; prerelease=true ;;
            *-*)
              echo "::error::Unsupported pre-release $version. Use -beta.N or -rc.N (RELEASING.md)."
              exit 1 ;;
            *)
              prerelease=false
              line="${version%.*}"
              main_version="$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
              if git rev-parse --verify --quiet "origin/support/$line" >/dev/null &&
                 git merge-base --is-ancestor "$GITHUB_SHA" "origin/support/$line"; then
                dist_tag="support-$line"; latest=false
              elif git merge-base --is-ancestor "$GITHUB_SHA" origin/main && [ "$line" = "${main_version%.*}" ]; then
                dist_tag=latest; latest=true
              else
                echo "::error::Stable version $version is on neither main's release line ($main_version) nor support/$line. Tag the release → main merge commit (RELEASING.md)."
                exit 1
              fi ;;
          esac
          echo "Publishing $version to npm \"$dist_tag\" (GitHub latest: $latest, pre-release: $prerelease)"
          {
            echo "name=$(node -p "require('./package.json').name")"
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "latest=$latest"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      # Only esbuild (its binary comes from its platform package) and fsevents (macOS) have
      # install scripts
      - run: npm ci --ignore-scripts
      - name: Audit runtime dependencies (no high or critical findings)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run validate
      - run: npm run build # tsc -b (type check), then vite build
      - name: Check the bundled DOMPurify
        run: node .github/scripts/check-dompurify.mjs
      - name: Pack and check the package contents
        id: pack
        run: |
          npm pack --json --silent --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node .github/scripts/check-pack.mjs "$RUNNER_TEMP/pack.json"
          tarball="$(node -p "const p = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); (Array.isArray(p) ? p[0] : Object.values(p)[0]).filename" "$RUNNER_TEMP/pack.json")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    # Only a tag push can get the npm token; a manual run, even on a tag, rehearses
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest # trusted publishing requires a GitHub-hosted runner
    permissions:
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.21.1 (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@11.21.1 --ignore-scripts
      - name: Publish to npm
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public --tag "$DIST_TAG"

  rehearse:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {} # no npm token: provenance and the token exchange aren't rehearsed
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          registry-url: https://registry.npmjs.org
      - name: Use npm 11.21.1
        run: npm install -g npm@11.21.1 --ignore-scripts
      - name: Rehearse the publish (npm publish --dry-run)
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          NAME: ${{ needs.build.outputs.name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # npm's dry run still refuses a version that's already published
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "::notice::$NAME@$VERSION is already on npm; bump the version to rehearse its publish. Every other check passed."
            exit 0
          fi
          npm publish "./$TARBALL" --access public --tag "$DIST_TAG" --dry-run

  github-release:
    needs: [build, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.build.outputs.latest }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --latest="$LATEST" --prerelease="$PRERELEASE"
